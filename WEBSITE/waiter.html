<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Waiter Orders & Calls</title><link rel="stylesheet" href="waiter.css?v=full-33"><link rel="stylesheet" href="call-requests.css?v=full-33"><style>.compact-alerts{margin:24px 0;}.compact-alerts p{color:#b91c1c;font-size:14px;line-height:1.5;margin-top:10px;}[hidden]{display:none!important;}</style><style>.reserved-waiter-alert{padding:16px;border:1px solid #b7791f;background:#fff3cd;border-radius:10px;color:#683e00;}</style><link rel="stylesheet" href="request-ring.css?v=full-33"><link rel="stylesheet" href="yaar-theme.css?v=full-33"><link rel="stylesheet" href="dark-theme.css?v=full-33"><link rel="stylesheet" href="device-layouts.css?v=full-33"></head>
<body class="waiter-site dark-site">
<header class="waiter-header"><div class="waiter-header-brand"><div class="staff-brand"><svg class="brand-icon" aria-hidden="true"><use href="icons.svg#chef"></use></svg><strong>Pizza With Yaar</strong></div><h1>Waiter Display &amp; Requests</h1><span class="connection" id="waiterConnection">Connecting</span><span id="waiterRestaurant" hidden></span></div><details id="waiterTools" class="staff-account"><summary><span class="account-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3Z"/></svg></span><span><strong>Waiter</strong><small>Device controls</small></span><svg class="account-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg></summary><div class="account-menu"><button id="waiterThemeToggle" class="waiter-button" type="button" onclick="toggleWaiterTheme()">Use light theme</button><button id="waiterRefresh" class="waiter-button" type="button" onclick="loadWaiterOrders()">Refresh</button><button id="waiterSoundButton" class="waiter-button" type="button" aria-pressed="false" hidden>Enable call sound</button><section id="backgroundAlertPanel" class="compact-alerts" hidden aria-label="Call alerts"><button id="backgroundAlertButton" type="button" aria-pressed="false" class="waiter-button">Call alerts</button><p id="backgroundAlertStatus" role="status" hidden></p></section></div></details></header>
<main><p id="reservedWaiterAlert" class="reserved-waiter-alert" role="alert" hidden></p><p id="waiterError" role="status"></p>

<nav id="waiterMobileNav" class="waiter-mobile-nav" aria-label="Waiter workspace" hidden><button type="button" id="waiterRequestsView" aria-pressed="true" aria-controls="waiterCallPanel" onclick="setWaiterView('requests')">Requests <span id="waiterRequestsViewCount">0</span></button><button type="button" id="waiterOrdersView" aria-pressed="false" aria-controls="waiterOrdersSection" onclick="setWaiterView('orders')">Orders <span id="waiterOrdersViewCount">0</span></button></nav><div class="waiter-workspace"><section id="waiterCallPanel" aria-labelledby="waiterCallHeading" hidden>
<div class="page-heading"><div><h2 id="waiterCallHeading">Requests <span id="waiterCallCount" class="call-count">0</span></h2></div></div>
<p id="waiterCallNotice" role="status" hidden></p><div id="waiterCalls"></div>
</section>
<section id="waiterOrdersSection" class="waiter-orders-section" hidden aria-labelledby="waiterOrderHeading"><div class="page-heading"><h2 id="waiterOrderHeading">Pending orders</h2><p id="waiterCount" class="muted"></p></div><div class="orders-grid" id="waiterOrders"></div></section>
</div></main>
<script src="config.js?v=full-33"></script><script src="cloud.js?v=full-33"></script><script src="push-config.js?v=full-33"></script><script src="background-alerts.js?v=full-33"></script><script src="call-requests.js?v=full-33"></script><script src="request-ring.js?v=full-33"></script><script src="waiter.js?v=full-33"></script>
</body></html>
