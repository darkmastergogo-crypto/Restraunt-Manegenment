name = "restaurant-platform"
main = "platform/worker.mjs"
compatibility_date = "2026-11-09"

[assets]
directory = "./WEBSITE"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[r2_buckets]]
binding = "RESTAURANT_MEDIA"
bucket_name = "restaurant-platform-media"

[vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_PUBLIC_KEY = "sb_publishable_REPLACE"
APP_ORIGIN = "https://YOUR_APP.example"
INVITATION_FROM = "Restaurant Access <invites@YOUR_DOMAIN.example>"
