  <script>
    /* Paint the saved theme, app name and logo before anything else, so changes made in Admin never flash on start. */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('SHOPBILL_THEME_CSS') || 'null');
        if (t) { document.documentElement.dataset.theme = t[0]; var s = document.createElement('style'); s.id = 'themeStyle'; s.textContent = t[1]; document.head.appendChild(s); document.querySelector('meta[name=theme-color]').setAttribute('content', t[2]); }
        var b = JSON.parse(localStorage.getItem('SHOPBILL_BRAND') || 'null');
        if (b) { document.title = b.title; document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', b.short); }
        var i = JSON.parse(localStorage.getItem('SHOPBILL_ICON') || 'null');
        if (i && i.icon) { var l = document.querySelector('link[rel=icon]'); l.href = i.icon; l.type = 'image/png'; document.querySelector('link[rel=apple-touch-icon]').href = i.icon; }
      } catch (e) { /* first start */ }
    })();
  </script>
