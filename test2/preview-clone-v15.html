<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Restaurant UI clone — read-only preview</title>
  <meta name="description" content="Billing, stock, members and sales records for your business.">
  <meta name="theme-color" content="#1c2433">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shop Billing">
  
  
  
  <script>
    /* Paint the saved theme, app name and logo before anything else, so changes made in Admin never flash on start. */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('SHOPBILL_THEME_CSS') || 'null');
        if (t) { document.documentElement.dataset.theme = t[0]; var s = document.createElement('style'); s.id = 'themeStyle'; s.textContent = t[1]; document.head.appendChild(s); document.querySelector('meta[name=theme-color]').setAttribute('content', t[2]); }
        var b = JSON.parse(localStorage.getItem('SHOPBILL_BRAND') || 'null');
        if (b) { document.title = b.title; document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', b.short); }
        var i = JSON.parse(localStorage.getItem('SHOPBILL_ICON') || 'null');
        if (i && i.icon) { var l = document.querySelector('link[rel=icon]'); l.href = i.icon; l.type = 'image/png'; document.querySelector('link[rel=apple-touch-icon]').href = i.icon; }
      } catch (e) { /* first start */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>/* ===================== Tokens ===================== */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f6f8fa; --line: #d9dfe6; --line-2: #e7ebf0;
  --ink: #1c2433; --ink-2: #445063; --muted: #6b7685;
  --primary: #1f5fbf; --primary-ink: #ffffff; --primary-soft: #e4edfa; --primary-hover: #194f9f;
  --green: #13795b; --green-soft: #e3f3ec; --red: #c2362f; --red-soft: #fbe9e7; --amber: #95600a; --amber-soft: #fdf1d8;
  --side: #1c2433; --side-ink: #c4cdd9; --side-hi: #ffffff; --side-on: #2b3750;
  --paper: #fffefa; --paper-ink: #1f1f1f; --paper-rule: #c9c4b8;
  --focus: 0 0 0 3px rgba(31, 95, 191, .35);
  --radius: 8px; --radius-sm: 6px;
  --font: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --surface-2: #212834; --line: #2f3845; --line-2: #262e3a;
  --ink: #e6eaf0; --ink-2: #b9c2ce; --muted: #8b96a6;
  --primary: #5b93e6; --primary-ink: #0b1220; --primary-soft: #1d2c44; --primary-hover: #7aa8ec;
  --green: #4cc38a; --green-soft: #15302a; --red: #ef6b62; --red-soft: #3a1f1f; --amber: #e3ac4f; --amber-soft: #352a17;
  --side: #0d1015; --side-ink: #a9b3c1; --side-on: #1e2735;
  --paper: #f4f1e8; --paper-ink: #1f1f1f; --paper-rule: #bdb7aa;
  --focus: 0 0 0 3px rgba(91, 147, 230, .45);
  color-scheme: dark;
}

/* ===================== Base ===================== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.01em; }
h1 { font-size: 1.55rem; font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--primary); }
small { color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-size: .92em; }
.small { font-size: .85rem; }
.muted { color: var(--muted); }
.neg { color: var(--red); font-weight: 600; }
.pos { color: var(--green); font-weight: 600; }
.warn { color: var(--amber); font-weight: 600; }
.pre { white-space: pre-line; }
.grow { flex: 1; }
.ico { width: 18px; height: 18px; flex: none; }
kbd { font: 600 .7rem/1 var(--mono); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===================== Controls ===================== */
input, select, textarea { background: var(--surface); border: 1px solid var(--line-strong, var(--line)); border-radius: var(--radius-sm); padding: 9px 11px; min-height: 40px; width: 100%; }
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: var(--focus); outline: none; }
input[type=checkbox] { width: 18px; height: 18px; min-height: 0; accent-color: var(--primary); margin: 0; }
input:disabled, select:disabled { opacity: .55; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: .92rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line); }
.btn-danger { background: var(--red); border-color: var(--red); color: var(--on-red, #fff); }
.btn-danger-ghost { background: transparent; border-color: var(--line); color: var(--red); }
.btn-danger-ghost:hover:not(:disabled) { border-color: var(--red); background: var(--red-soft); }
.btn-sm { min-height: 32px; padding: 5px 10px; font-size: .85rem; }
.btn-lg { min-height: 48px; font-size: 1rem; }
.btn kbd { border-color: currentColor; color: inherit; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-sm); border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.linkish { background: none; border: 0; padding: 0; color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .9rem; }
.file-btn input { display: none; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.joined { display: flex; }
.joined > :first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.joined > :last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; width: auto; }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 4px; font-weight: 600; font-size: .86rem; color: var(--ink-2); cursor: pointer; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button.on { background: var(--ink); color: var(--surface); }
:root[data-theme="dark"] .seg button.on { background: var(--primary); color: var(--primary-ink); }

.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .76rem; font-weight: 650; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.badge-green { background: var(--green-soft); color: var(--green); border-color: transparent; }
.badge-red { background: var(--red-soft); color: var(--red); border-color: transparent; }
.badge-amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }

.field { display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.field > span { font-weight: 600; color: var(--ink-2); }
.field em { font-style: normal; font-weight: 400; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; min-height: 32px; }
.static { padding: 9px 0; }
.hint { color: var(--muted); font-size: .86rem; }
.hint-list { color: var(--ink-2); font-size: .88rem; padding-left: 20px; margin: 10px 0 14px; }
.form-error { color: var(--red); background: var(--red-soft); padding: 9px 12px; border-radius: var(--radius-sm); font-size: .88rem; font-weight: 500; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; align-content: start; }
.span-2 { grid-column: 1 / -1; }
.sub-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface-2); margin: 0; }
.form-actions, .modal-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.inline-form { display: flex; gap: 8px; margin: 12px 0; }
.inline-form.wrap { flex-wrap: wrap; }
.inline-form.wrap > input { flex: 1 1 180px; width: auto; }
.inline-form.wrap > select { flex: 0 1 140px; width: auto; }
.notice { padding: 12px 14px; border-radius: var(--radius-sm); font-size: .9rem; margin-bottom: 16px; }
.notice-bad { background: var(--red-soft); color: var(--red); }

/* ===================== Auth / boot ===================== */
.auth-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; gap: 18px; }
.auth-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px; }
.auth-card h1 { margin: 16px 0 4px; }
.auth-card .sub { color: var(--muted); margin-bottom: 22px; }
.brand-mark { width: 48px; height: 48px; border-radius: 10px; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.brand-mark .ico { width: 26px; height: 26px; }
.vendor { color: var(--muted); font-size: .86rem; text-align: center; }
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); }

/* ===================== Shell ===================== */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 16px 12px; gap: 18px; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; border-bottom: 1px solid var(--side-line, rgba(255,255,255,.08)); }
.side-brand b { color: var(--side-hi); display: block; font-size: .98rem; line-height: 1.25; }
.side-brand small { color: var(--side-muted, var(--side-ink)); font-size: .78rem; }
.logo-chip { width: 38px; height: 38px; border-radius: 8px; background: var(--paper); color: var(--paper-ink); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; overflow: hidden; flex: none; }
.logo-chip img { width: 100%; height: 100%; object-fit: contain; }
.side-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.side-nav a, .side-btn { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: var(--radius-sm); color: var(--side-ink); text-decoration: none; font-weight: 600; font-size: .93rem; border: 0; background: none; cursor: pointer; width: 100%; text-align: left; }
.side-nav a:hover, .side-btn:hover { background: var(--side-on); color: var(--side-hi); }
.side-nav a.on { background: var(--side-on); color: var(--side-hi); box-shadow: inset 3px 0 0 var(--primary); }
.side-nav a kbd { margin-left: auto; color: var(--side-muted, var(--side-ink)); background: none; border-color: currentColor; }
.side-foot { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--side-line, rgba(255,255,255,.08)); padding-top: 12px; }
.who { display: flex; gap: 12px; align-items: center; padding: 10px; font-size: .85rem; }
.who b { color: var(--side-hi); display: block; }
.who small { color: var(--side-muted, var(--side-ink)); display: block; overflow: hidden; text-overflow: ellipsis; max-width: 160px; white-space: nowrap; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
.top-title { font-size: 1rem; }
.top-gap { flex: 1; }
.menu-btn { display: none; }
.net { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; }
.net.on { color: var(--green); }
.net.on span { display: none; }
.net.off { color: var(--red); background: var(--red-soft); padding: 4px 10px; border-radius: 99px; }
.clock { color: var(--muted); font-size: .85rem; }
#view { flex: 1; outline: none; min-width: 0; }
.scrim { display: none; }

/* ===================== Pages ===================== */
.page { padding: 24px 28px 48px; max-width: 1320px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filters select { width: auto; min-width: 150px; }
.range { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.range input { width: auto; }
.search { position: relative; display: flex; align-items: center; flex: 1; }
.search .ico { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }
.search input { padding-left: 38px; }
.search kbd { position: absolute; right: 10px; color: var(--muted); }
.search.sm { flex: 0 1 280px; }
.status-line { color: var(--muted); font-size: .88rem; margin-bottom: 10px; min-height: 1.3em; }
.filter-note { margin-bottom: 12px; color: var(--ink-2); }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.sum { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.sum span { color: var(--muted); font-size: .8rem; font-weight: 600; }
.sum b { font-size: 1.12rem; }
.sum small { font-size: .75rem; }
.sum.big b { font-size: 1.4rem; color: var(--green); }
.sum.is-warn b { color: var(--amber); }
.sum.is-bad b { color: var(--red); }

.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th { text-align: left; font-size: .78rem; font-weight: 650; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.table td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table td small { display: block; font-size: .78rem; }
.table tbody tr[data-id] { cursor: pointer; }
.table tbody tr[data-id]:hover { background: var(--surface-2); }
.table .num { text-align: right; white-space: nowrap; }
.table .num small { display: block; }
.table .row-act { text-align: right; white-space: nowrap; }
.table .row-act .btn + .btn, .table .row-act .btn + .icon-btn { margin-left: 4px; }
.table.compact td, .table.compact th { padding: 8px 4px; background: none; }
.is-void td { color: var(--muted); }
.is-void td b { text-decoration: line-through; }
.is-muted td { color: var(--muted); }
.pm { font-weight: 600; font-size: .85rem; }
.pm-credit { color: var(--amber); }
.pager { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: .86rem; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty h3 { color: var(--ink); font-size: 1rem; }
.empty.slim { padding: 18px 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card > h2 { margin-bottom: 14px; }
.plain-list { list-style: none; padding: 0; margin: 0 0 10px; }
.plain-list li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); align-items: center; font-size: .9rem; }
.plain-list li:last-child { border-bottom: 0; }

/* ===================== Billing ===================== */
.billing { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100vh - 52px); }
.catalog { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 16px 18px 0; }
.catalog-bar { display: flex; gap: 10px; }
.catalog-bar .search input { min-height: 48px; font-size: 1.05rem; border-width: 1.5px; }
.catalog-bar .btn { min-height: 48px; }
.chips { display: flex; gap: 6px; padding: 12px 0; overflow-x: auto; scrollbar-width: thin; flex: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 600; font-size: .86rem; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
:root[data-theme="dark"] .chip.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; align-content: start; padding-bottom: 20px; }
.tile { position: relative; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 92px; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.tile:hover { border-color: var(--primary); }
.tile.hl { border-color: var(--primary); box-shadow: var(--focus); }
.tile.off { cursor: not-allowed; background: var(--surface-2); border-style: dashed; color: var(--muted); }
.tile.off .tile-name, .tile.off .tile-foot b { color: var(--muted); }
.tile-name { font-weight: 600; font-size: .92rem; line-height: 1.3; max-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: none; }
.tile-foot { display: flex; align-items: baseline; gap: 2px; flex-wrap: wrap; }
.tile-foot b { font-size: .98rem; }
.tile-foot small { font-size: .78rem; margin-right: auto; }
.tile-foot .badge { font-size: .7rem; padding: 1px 6px; }
.stock-note { font-size: .74rem; color: var(--muted); }
.tile-code { font: .7rem var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -6px; order: 1; }
.tile-name { order: 0; } .tile-foot { order: 2; }
.tile.in-bill { border-color: var(--primary); background: var(--primary-soft); }
.tile-qty { position: absolute; top: -7px; right: -6px; min-width: 30px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--primary); color: var(--primary-ink);
  font: 700 .82rem/26px var(--font); text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.tile-qty.bump { animation: pop .2s ease-out; }
@keyframes pop { from { transform: scale(.6); } to { transform: none; } }
.grid { padding-top: 8px; padding-right: 6px; }
.grid-more { grid-column: 1 / -1; color: var(--muted); font-size: .86rem; text-align: center; padding: 10px; }
.grid .empty { grid-column: 1 / -1; }

/* Ticket — the receipt roll */
.ticket { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px 16px 4px; min-height: 0; }
.sheet-close { display: none; }
.paper { flex: 1; min-height: 180px; display: flex; flex-direction: column; background: var(--paper); color: var(--paper-ink); font-family: var(--mono); border-radius: 3px 3px 0 0; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 18px -8px rgba(28,36,51,.28); position: relative; margin-bottom: 10px; }
.paper::after { content: ''; position: absolute; left: 0; right: 0; bottom: -9px; height: 10px; background: linear-gradient(-45deg, transparent 6px, var(--paper) 0) 0 0 / 12px 10px repeat-x, linear-gradient(45deg, transparent 6px, var(--paper) 0) 0 0 / 12px 10px repeat-x; filter: drop-shadow(0 3px 2px rgba(28,36,51,.1)); }
.paper-head { display: flex; justify-content: space-between; padding: 12px 16px 10px; font-size: .78rem; font-weight: 600; text-transform: none; border-bottom: 1.5px dashed var(--paper-rule); color: #555; }
.t-lines { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; min-height: 0; }
.tl { display: grid; grid-template-columns: minmax(0, 1fr) auto 76px 26px; gap: 6px; align-items: center; padding: 8px 10px 8px 16px; border-bottom: 1px dotted var(--paper-rule); font-size: .86rem; }
.tl.flash { animation: flash 1s ease-out; }
@keyframes flash { from { background: #fff1b8; } to { background: transparent; } }
.tl-name { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.tl-name small { display: block; color: #6b6b6b; font-weight: 400; font-size: .76rem; }
.tl-name em { font-style: normal; font-size: .68rem; font-weight: 600; border: 1px solid #999; border-radius: 3px; padding: 0 4px; margin-left: 6px; color: #555; }
.tl-qty { display: flex; align-items: center; border: 1px solid #cfc9bc; border-radius: 5px; background: #fff; }
.tl-qty input { width: 52px; min-height: 30px; border: 0; padding: 2px; text-align: center; font: 600 .88rem var(--mono); background: transparent; color: var(--paper-ink); -moz-appearance: textfield; border-radius: 0; }
.tl-qty input::-webkit-inner-spin-button, .tl-qty input::-webkit-outer-spin-button { -webkit-appearance: none; }
.tl-qty input:focus { box-shadow: none; background: #fff6d6; }
.qbtn { width: 28px; height: 30px; border: 0; background: none; color: #444; display: grid; place-items: center; cursor: pointer; }
.qbtn .ico { width: 15px; height: 15px; }
.qbtn:hover:not(:disabled) { background: #f0ece2; }
.tl-amt { text-align: right; font-weight: 600; }
.tl-del { width: 26px; height: 26px; border: 0; background: none; color: #8a8a8a; cursor: pointer; display: grid; place-items: center; border-radius: 4px; }
.tl-del:hover:not(:disabled) { color: var(--red); background: #fbe9e7; }
.tl-del .ico { width: 15px; height: 15px; }
.t-empty { padding: 34px 22px; text-align: center; color: #6b6b6b; display: flex; flex-direction: column; gap: 6px; font-family: var(--font); font-size: .9rem; }
.t-empty b { color: var(--paper-ink); }
.t-sums { padding: 10px 16px 14px; border-top: 1.5px dashed var(--paper-rule); font-size: .88rem; }
.ts { display: flex; justify-content: space-between; padding: 2px 0; }
.ts-less { color: var(--amber); font-weight: 600; }
.short-ok { color: var(--amber); }
.short-ok b { color: var(--ink); }
.ts-grand { font-size: 1.45rem; font-weight: 700; padding-top: 8px; margin-top: 6px; border-top: 1px solid var(--paper-ink); letter-spacing: -.02em; }
.t-controls { display: flex; flex-direction: column; gap: 10px; flex: none; }
.t-row { display: grid; grid-template-columns: 110px 1fr auto; align-items: center; gap: 10px; font-size: .88rem; font-weight: 600; color: var(--ink-2); }
.t-row .joined input { min-width: 0; }
.t-row .joined select { width: 64px; }
.change { font-weight: 500; color: var(--ink-2); grid-column: 1 / -1; font-size: .88rem; }
.change b { color: var(--green); font-size: 1.05rem; }
.t-cust { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 6px; }
.pay button { min-height: 42px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); font-weight: 650; color: var(--ink-2); cursor: pointer; }
.pay button:hover:not(:disabled) { border-color: var(--ink-2); }
.pay button.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.pay button[data-pay="Credit"].on { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.t-actions { display: grid; grid-template-columns: auto 1fr 1.5fr; gap: 8px; }
.t-actions .btn-lg { min-height: 50px; }
.t-pending { background: var(--amber-soft); color: var(--amber); padding: 8px 12px; border-radius: var(--radius-sm); font-size: .85rem; font-weight: 600; }
.t-done { background: var(--green-soft); border: 1px solid transparent; border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; animation: rise .25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.done-text { display: flex; gap: 8px; align-items: center; color: var(--green); font-size: .9rem; }
.done-text b { font-family: var(--mono); }
.done-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.m-bar { display: none; }

/* ===================== Dashboard ===================== */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpis .kpi-hero { grid-column: span 2; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi span { color: var(--muted); font-size: .82rem; font-weight: 600; }
.kpi b { font-size: 1.35rem; letter-spacing: -.01em; }
.kpi small { font-size: .78rem; }
.kpi-hero { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.kpi-hero span { color: inherit; opacity: .85; }
.kpi-hero b { font-size: 1.9rem; }
:root[data-theme="dark"] .kpi-hero { background: var(--primary-soft); border-color: var(--primary-soft); color: var(--ink); }
.delta { font-size: .8rem; font-weight: 600; opacity: .85; }
.delta.up { color: #7fd8aa; }
.delta.down { color: #ff9b94; }
:root:not([data-theme="dark"]) .kpi-hero .delta.up { color: #8be0b3; }
.dash-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.dash-grid .span-2 { grid-column: span 2; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid-l { stroke: var(--line-2); stroke-width: 1; }
.chart .base-l { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .bar path { fill: var(--primary); }
.chart .bar .hit { fill: transparent; }
.chart .bar.on .hit { fill: var(--surface-2); }
.chart .bar.on path { fill: var(--primary-hover); }
.tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 6px; font-size: .8rem; display: flex; flex-direction: column; pointer-events: none; white-space: nowrap; z-index: 2; }
.tip small { color: inherit; opacity: .85; }
.hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; margin-bottom: 5px; }
.hb-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hb-track i { display: block; height: 100%; background: var(--primary); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbars small { font-size: .76rem; display: block; margin-top: 4px; }

/* ===================== Stocks ===================== */
.level { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.level b { font-size: .98rem; }
.meter { flex-basis: 100%; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; max-width: 160px; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--green); }
.level-low b { color: var(--amber); } .level-low .meter i { background: var(--amber); }
.level-out b { color: var(--red); } .level-out .meter i { background: var(--red); }

/* ===================== Settings ===================== */
.settings { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; }
.set-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 72px; }
.set-nav button { text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: var(--radius-sm); font-weight: 600; color: var(--ink-2); cursor: pointer; }
.set-nav button:hover { background: var(--surface); }
.set-nav button.on { background: var(--surface); color: var(--primary); box-shadow: inset 3px 0 0 var(--primary); }
#setBody { max-width: 860px; }
.logo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo-box { width: 72px; height: 72px; border: 1px dashed var(--line); border-radius: var(--radius); display: grid; place-items: center; background: #fff; color: #555; font-size: .75rem; overflow: hidden; }
.logo-box img { max-width: 100%; max-height: 100%; }
.checks { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px 14px; margin: 0; }
.checks legend { font-weight: 600; font-size: .88rem; padding: 0 6px; color: var(--ink-2); }
.design-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.design-preview { position: sticky; top: 72px; }
.design-preview h3 { margin-bottom: 8px; color: var(--muted); font-size: .85rem; }
.steps { padding-left: 20px; color: var(--ink-2); font-size: .9rem; margin: 10px 0; }
.steps li { margin: 4px 0; }
.data-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.data-row h3 { margin-bottom: 4px; }
.data-row > div:first-child { flex: 1 1 300px; }
.danger-zone h3 { color: var(--red); }
.cat-list { list-style: none; margin: 0; padding: 0; max-height: 50vh; overflow-y: auto; }
.cat-list li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-2); gap: 8px; }

/* ===================== Bill view / paper preview ===================== */
.bill-view { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
.bill-paper { background: #ececec; padding: 16px; border-radius: var(--radius); display: flex; justify-content: center; overflow: auto; max-height: 70vh; }
:root[data-theme="dark"] .bill-paper { background: #0d1015; }
.bill-paper .receipt { background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); padding: 14px 12px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0 0 16px; font-size: .9rem; align-items: center; }
.facts dt { color: var(--muted); font-weight: 600; }
.facts dd { margin: 0; }
.facts dd small { display: block; }
.facts select { min-height: 34px; padding: 4px 8px; }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.help-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.help-card h3 { color: var(--muted); font-size: .85rem; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: .9rem; align-items: center; }
.keys dt { white-space: nowrap; }
.keys dd { margin: 0; color: var(--ink-2); }
.keys kbd { opacity: 1; padding: 3px 6px; color: var(--ink); border-color: var(--line); background: var(--surface-2); }

/* ===================== Modals & toasts ===================== */
.modal { border: 0; border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 24px 60px -12px rgba(0,0,0,.4); }
.modal.modal-sm { width: min(440px, calc(100vw - 24px)); }
.modal.modal-md { width: min(640px, calc(100vw - 24px)); }
.modal.modal-lg { width: min(860px, calc(100vw - 24px)); }
.modal::backdrop { background: var(--scrim, rgba(14, 18, 26, .55)); }
.modal[open] { animation: rise .18s ease-out; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 18px 20px 20px; }
.modal-body > p + p { margin-top: 10px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 20px 18px; }
.modal-sm .modal-body p { color: var(--ink-2); }
.modal-sm .modal-body .field { margin-top: 14px; }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 1000; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: var(--radius); font-size: .9rem; font-weight: 500; box-shadow: 0 10px 30px -8px rgba(0,0,0,.4); animation: rise .2s ease-out; max-width: 560px; }
.toast-ok { border-left: 4px solid #4cc38a; }
.toast-warn { border-left: 4px solid #e3ac4f; }
.toast-error { background: var(--red); color: var(--on-red, #fff); }
.toast.out { opacity: 0; transition: opacity .3s; }

/* ===================== Printed receipt ===================== */
.receipt { color: #000; background: #fff; font-family: var(--mono); line-height: 1.35; margin: 0 auto; }
.receipt.paper-80 { width: 72mm; }
.receipt.paper-58 { width: 48mm; }
.receipt.paper-a4 { width: 100%; max-width: 180mm; font-family: var(--font); }
.r-head { margin-bottom: 6px; }
.r-logo { max-width: 60%; max-height: 64px; object-fit: contain; display: inline-block; margin-bottom: 4px; }
.r-shop { font-size: 1.35em; font-weight: 700; }
.r-title { margin-top: 6px; font-weight: 700; text-decoration: underline; }
.r-void { border: 2px solid #000; text-align: center; font-weight: 700; letter-spacing: .2em; margin: 6px 0; padding: 2px; }
.r-meta { border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 4px 0; margin: 4px 0; }
.r-meta div { display: flex; justify-content: space-between; gap: 8px; }
.r-items { width: 100%; border-collapse: collapse; font-size: 1em; }
.r-items th { font-weight: 700; text-align: right; border-bottom: 1px dashed #000; padding: 2px 0; }
.r-items td { text-align: right; vertical-align: top; padding: 2px 0 2px 4px; }
.r-items .l { text-align: left; padding-left: 0; }
.r-items td small { display: block; color: #333; font-size: .82em; }
.paper-58 .r-items td:nth-child(3), .paper-58 .r-items th:nth-child(3) { display: none; }
.r-totals { border-top: 1px dashed #000; margin-top: 2px; padding-top: 4px; }
.r-row { display: flex; justify-content: space-between; gap: 8px; }
.r-muted { color: #333; font-size: .9em; }
.r-grand { font-size: 1.3em; font-weight: 700; border-top: 1px solid #000; border-bottom: 1px solid #000; margin: 4px 0; padding: 3px 0; }
.r-save { text-align: center; font-weight: 700; margin-top: 4px; }
.r-note { margin-top: 6px; border-top: 1px dashed #000; padding-top: 4px; }
.r-foot { margin-top: 8px; }
.r-vendor { margin-top: 8px; text-align: center; font-size: .78em; color: #333; }
.r-pre { white-space: pre-line; }
#printArea { display: none; }
@media print {
  body.printing > *:not(#printArea) { display: none !important; }
  body.printing { background: #fff; }
  body.printing #printArea { display: block; }
  #printArea .receipt { box-shadow: none; padding: 0; }
}

/* ===================== Responsive ===================== */
@media (max-width: 1180px) {
  .billing { grid-template-columns: minmax(0, 1fr) 380px; }
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .kpi-hero { grid-column: span 3; }
  .dash-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .design-wrap { grid-template-columns: 1fr; }
  .design-preview { position: static; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 50; transform: translateX(-100%); transition: transform .2s ease; }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(14,18,26,.5); z-index: 40; }
  .menu-btn { display: inline-grid; }
  .top { padding: 0 12px; }
  .clock { display: none; }
  .page { padding: 18px 16px 40px; }
  .billing { grid-template-columns: 1fr; height: calc(100vh - 52px); }
  .catalog { padding: 12px 16px 0; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); padding-bottom: 90px; }
  .ticket { position: fixed; inset: 0; z-index: 30; background: var(--bg); padding: 12px 16px 16px; transform: translateY(100%); transition: transform .22s ease; overflow-y: auto; }
  body.sheet-open .ticket { transform: none; }
  .sheet-close { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; border: 0; background: none; font-weight: 600; color: var(--primary); padding: 6px 0; cursor: pointer; }
  .paper { min-height: 260px; }
  .m-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px -10px rgba(0,0,0,.25); }
  .m-bar span { display: flex; flex-direction: column; }
  .m-bar b { font-size: 1.25rem; }
  .settings { grid-template-columns: 1fr; }
  .set-nav { position: static; flex-direction: row; overflow-x: auto; }
  .set-nav button { white-space: nowrap; }
  .set-nav button.on { box-shadow: inset 0 -3px 0 var(--primary); }
  .bill-view { grid-template-columns: 1fr; }
  .help-grid { grid-template-columns: 1fr; }
  .search.sm { flex: 1 1 100%; }
  .catalog-bar .btn span, .catalog-bar kbd, .search kbd { display: none; }
}
@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi-hero { grid-column: span 2; }
  .dash-grid { grid-template-columns: 1fr; }
  .dash-grid .span-2 { grid-column: auto; }
  .head-actions { width: 100%; }
  .filters .seg { width: 100%; }
  .filters select { flex: 1; min-width: 0; }
  .catalog-bar .btn { padding: 8px 12px; }
  .t-row { grid-template-columns: 96px 1fr; }
  .t-row .change { grid-column: 1 / -1; white-space: normal; }
  .table th, .table td { padding: 9px 10px; }
  h1 { font-size: 1.35rem; }
}

/* ===================== v2: forms, switches, admin ===================== */
.field select + input { margin-top: 8px; }
.stock-now { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 40px; }
.stock-now b { margin-right: 4px; }
.staff-form { display: grid; grid-template-columns: 1fr 1.3fr 1fr 140px auto; gap: 10px; align-items: end; margin: 14px 0 16px; }
.label-editor { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.label-editor summary { font-weight: 600; cursor: pointer; color: var(--ink-2); padding: 4px 0; }
.label-editor[open] summary { margin-bottom: 8px; }
.label-editor .form-grid { margin-top: 12px; }
.design-preview h3 small { font-weight: 400; }
.support-card { gap: 8px; }
.support-name { font-size: 1.25rem; font-weight: 700; }
.support-phone { font-size: 1.02rem; }

.switch { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; padding: 10px 0; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .sw { flex: none; width: 42px; height: 24px; border-radius: 12px; background: var(--line-strong, var(--line)); position: relative; transition: background .15s; margin-top: 1px; }
.switch .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + .sw { background: var(--primary); }
.switch input:checked + .sw::after { transform: translateX(18px); }
.switch input:focus-visible + .sw { box-shadow: var(--focus); }
.sw-text { display: flex; flex-direction: column; gap: 2px; }
.sw-text b { font-weight: 600; font-size: .93rem; }
.sw-text small { font-size: .82rem; }
.switches { display: grid; gap: 0 24px; }
.switches.two { grid-template-columns: 1fr 1fr; }
.switches .switch { border-bottom: 1px solid var(--line-2); }
.pay-toggles { display: flex; gap: 10px; flex-wrap: wrap; }
.pay-toggles .switch { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; min-width: 140px; }
.swatches { border: 0; padding: 0; margin: 0; display: flex; gap: 14px; flex-wrap: wrap; }
.swatches legend { font-weight: 600; font-size: .88rem; color: var(--ink-2); margin-bottom: 10px; padding: 0; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.swatch input { position: absolute; opacity: 0; }
.swatch span { width: 40px; height: 40px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.swatch input:checked + span { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--c); }
.swatch input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 4px; }

.side-nav a.nav-admin { margin-top: 10px; border-top: 1px solid var(--side-line, rgba(255,255,255,.08)); border-radius: 0 0 var(--radius-sm) var(--radius-sm); padding-top: 14px; }
.side-nav a.nav-admin .ico { color: var(--side-gold, #f3c969); }
.admin-page h1 { display: flex; align-items: center; gap: 10px; }
.admin-page h1 .ico { width: 28px; height: 28px; color: var(--primary); }
.admin-summary { grid-template-columns: repeat(3, 1fr); }
.admin-summary .sum b { font-size: 1rem; }
.admin-layout { grid-template-columns: 250px minmax(0, 1fr); }
.admin-nav button { display: flex; gap: 12px; align-items: flex-start; padding: 11px 12px; }
.admin-nav button .ico { margin-top: 2px; color: var(--muted); }
.admin-nav button.on .ico { color: var(--primary); }
.admin-nav button span { display: flex; flex-direction: column; gap: 1px; }
.admin-nav button b { font-weight: 650; }
.admin-nav button small { font-weight: 400; font-size: .78rem; }
.card-head { margin-bottom: 4px; }
.card-head h2 { margin-bottom: 4px; }
.admin-stack { display: flex; flex-direction: column; gap: 14px; max-width: 860px; }
.admin-split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.admin-preview { position: sticky; top: 72px; }
.admin-preview h3 { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
.admin-preview .help-card { background: var(--surface); }
.admin-preview .btn { pointer-events: none; }
.sticky-save { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 40%); padding: 18px 0 8px; }
.perm-wrap { border: 0; margin: 10px 0 4px; }
.perm-table td, .perm-table th { padding: 9px 12px; }

/* tables become cards on phones */
@media (max-width: 700px) {

'use strict';
const Cloud = (() => {
  const cfg = typeof SHOP_CONFIG === 'undefined' ? {} : SHOP_CONFIG;

  const key = String(cfg.supabaseAnonKey || '');

  try { session = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { session = null; }

  /* Applies a theme to the whole page, and remembers the finished CSS so the next start paints it before anything else (no flash). */
  function apply(id, accent) {
    const t = get(id), text = css(t, accent);
    document.documentElement.dataset.theme = t.mode;
    let st = document.getElementById('themeStyle');

  function swatch(t, accent) {
    const k = tokens(t, accent);
    return `<span class="theme-mini" style="background:${k['--bg']}"><i style="background:${k['--side']}"><s style="background:${k['--side-ink']}"></s><s style="background:${k['--side-ink']}"></s></i><b style="background:${k['--surface']};border-color:${k['--line']}"><em style="background:${k['--primary']}"></em><u style="background:${k['--ink']}"></u><u style="background:${k['--muted']}"></u></b></span>`;

  <script>/* Shared state and small UI helpers used by every screen. */
'use strict';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ROLE_LABEL = { superadmin: 'Admin', owner: 'Owner', manager: 'Manager', cashier: 'Cashier', member: 'Member' };

/* What each permission means, grouped for the Admin → Roles & permissions screen. */
const PERMISSIONS = [
  ['Screens', [['billing', 'Billing counter'], ['records', 'Records (today)'], ['records_all', 'Records (any date)'], ['dashboard', 'Dashboard'], ['items', 'Items'], ['stocks', 'Stocks']]],
  ['Billing', [['discount', 'Give discounts'], ['short_cash', 'Accept less cash than the total'], ['cancel_bills', 'Cancel bills'], ['export', 'Export records to CSV']]],
  ['Expenses', [['expenses', 'See and add expenses'], ['expenses_manage', 'Edit, delete, expense types & auto expenses']]],
  ['Members', [['members', 'See members'], ['members_add', 'Add and edit members'], ['members_renew', 'Renew or change a membership'], ['members_plans', 'Plans, dates & check-in code'], ['members_login', 'Member logins'], ['attendance', 'Attendance (check members in)']]],
  ['Settings', [['settings_shop', 'Shop details'], ['settings_tax', 'Billing (tax, payments, stock)'], ['settings_design', 'Bill design & extras'], ['settings_contact', 'Shop contact info'], ['staff', 'Staff & logins'], ['roles_manager', 'Change what managers can do'], ['roles_cashier', 'Change what cashiers can do'], ['reset', 'Delete all bills']]]
];

/* Which screen each permission belongs to. A screen switched off in the preset hides its permissions too. */
const PERM_MODULE = { billing: 'billing', records: 'records', records_all: 'records', cancel_bills: 'records', export: 'records', dashboard: 'dashboard', items: 'items', stocks: 'stocks',
  expenses: 'expenses', expenses_manage: 'expenses', members: 'members', members_add: 'members', members_renew: 'members', members_plans: 'members', members_login: 'members', attendance: 'members' };
/* Default screen names; a preset can rename them (e.g. Members → Students). */
const MODULE_LABEL = { billing: 'Billing', dashboard: 'Dashboard', records: 'Records', items: 'Items', stocks: 'Stocks', expenses: 'Expenses', members: 'Members' };

const Store = {
  me: null,            // { role, name, email, today, settings, system, perms }
  items: [],
  categories: [],
  itemsLoadedAt: 0,
  get settings() { return this.me?.settings || {}; },
  get sys() { return this.me?.system || App.publicInfo || {}; },
  get role() { return this.me?.role || ''; },
  get isAdmin() { return this.role === 'superadmin'; },
  feature(name) { const f = this.sys.features || {}; return name in f ? f[name] !== false : !['customer_details', 'customer_address'].includes(name); },
  can(perm) {
    const p = this.me?.perms || [];
    if (perm === 'settings') return ['settings_shop', 'settings_tax', 'settings_design', 'settings_contact', 'staff', 'reset', 'roles_manager', 'roles_cashier'].some(x => p.includes(x));
    if (perm === 'stocks') return p.includes('stocks') && this.stockShown();
    return p.includes(perm);
  },
  payments() { const p = this.sys.payments || {}; return ['Cash', 'UPI', 'Card'].filter(m => p[m] !== false); },
  get isMember() { return this.role === 'member'; },
  moduleOn(m) { const mods = this.sys.modules || {}; return m in mods ? mods[m] !== false : m !== 'members'; },
  permShown(perm) { const m = PERM_MODULE[perm]; return !m || this.moduleOn(m); },
  label(m) { return (this.sys.labels || {})[m] || MODULE_LABEL[m] || m; },
  /* singular for "Add member" / "Add student" */
  label1(m) { const l = this.label(m); return /ies$/i.test(l) ? l.replace(/ies$/i, 'y') : l.replace(/s$/i, ''); },
  /* Stock can be hidden by the owner/manager; Admin always sees it. */
  stockShown() { return this.isAdmin || !this.settings.stock_hidden; },
  /* Optional item fields switched on in Settings → Billing. HSN is on by default; others off. */
  itemField(k) { const f = this.settings.item_fields || {}; return k in f ? !!f[k] : k === 'hsn'; },
  invoice() { return this.settings.invoice || {}; },
  async loadItems(force = false) {
    if (!force && this.itemsLoadedAt && Date.now() - this.itemsLoadedAt < 15000) return this.items;
    const data = await Cloud.rpc('shop_items_list');
    this.items = data.items || []; this.categories = data.categories || []; this.itemsLoadedAt = Date.now();
    document.dispatchEvent(new CustomEvent('items:changed'));
    return this.items;
  },
  upsertItem(item) {
    const i = this.items.findIndex(x => x.id === item.id);
    if (i >= 0) this.items[i] = item; else this.items.push(item);
    if (item.category && !this.categories.includes(item.category)) this.categories.push(item.category);
    this.items.sort((a, b) => a.name.localeCompare(b.name));
    document.dispatchEvent(new CustomEvent('items:changed'));
  },
  /* Patch stock counts locally from a bill/cancel response instead of re-downloading the whole item list. */
  applyStockUpdates(updates) {
    if (!updates?.length) return;
    for (const u of updates) { const it = this.items.find(x => x.id === u.id); if (it) it.stock = u.stock; }
    document.dispatchEvent(new CustomEvent('items:changed'));
  }
};

const Fmt = {
  nf2: new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  nf0: new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }),
  nfq: new Intl.NumberFormat('en-IN', { maximumFractionDigits: 3 }),
  cur() { return Store.settings.currency || '₹'; },
  money(v) { return this.cur() + this.nf2.format(Number(v) || 0); },
  money0(v) { return this.cur() + this.nf0.format(Math.round(Number(v) || 0)); },
  compact(v) { const n = Number(v) || 0; if (Math.abs(n) >= 1e7) return this.cur() + (n / 1e7).toFixed(1).replace(/\.0$/, '') + 'Cr'; if (Math.abs(n) >= 1e5) return this.cur() + (n / 1e5).toFixed(1).replace(/\.0$/, '') + 'L'; if (Math.abs(n) >= 1e3) return this.cur() + (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k'; return this.cur() + Math.round(n); },
  qty(v) { return this.nfq.format(Number(v) || 0); },
  tz() { return Store.settings.timezone || 'Asia/Kolkata'; },
  dateTime(iso) { return new Date(iso).toLocaleString('en-IN', { timeZone: this.tz(), day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); },
  time(iso) { return new Date(iso).toLocaleTimeString('en-IN', { timeZone: this.tz(), hour: 'numeric', minute: '2-digit' }); },
  date(d) { const dt = typeof d === 'string' && d.length === 10 ? new Date(d + 'T12:00:00Z') : new Date(d); return dt.toLocaleDateString('en-IN', { timeZone: typeof d === 'string' && d.length === 10 ? 'UTC' : this.tz(), day: 'numeric', month: 'short', year: 'numeric' }); },

  let category = 'All', query = '', highlight = 0, saving = false, pending = null, lastBill = null, showExtras = false, root = null, catalogSig = '';

  try { pending = JSON.parse(localStorage.getItem(PENDING_KEY()) || 'null'); } catch { pending = null; }
  if (pending) ({ cart, payment, discount, customer, notes, received = '', fields = {} } = pending.state);
  customer = { name: '', phone: '', address: '', ...customer };

  const cashOn = () => payment === 'Cash' && Store.feature('cash_received');
  const warnMode = () => !!Store.settings.allow_negative_stock;      // true: warn and allow; false: stop at stock
  const customFields = () => { const c = Store.invoice().custom_fields || {}; return c.enabled ? (c.fields || []).filter(Boolean) : []; };

  /* Lines in the order the server receives them (oldest first). */
  function calcLines() {
    const s = Store.settings;
    return [...cart].reverse().map(l => l.custom
      ? { qty: l.qty, price: l.price, discount_pct: 0, tax_rate: s.tax_value, incl: !!s.tax_inclusive_default }
      : { qty: l.qty, price: l.price, discount_pct: l.dpct || 0, tax_rate: l.rate ?? s.tax_value, incl: !!l.incl });
  }
  function totals() {
    const sys = Store.sys;
    return Calc.bill(calcLines(), Store.settings, { discount, canDiscount: Store.can('discount'), received, cashOn: cashOn(),
      canShort: Store.can('short_cash'), maxShort: sys.limits?.max_short_amount ?? 0, isAdmin: Store.isAdmin });
  }
  const lineTotal = l => { const s = Store.settings; return Calc.bill([{ qty: l.qty, price: l.price, discount_pct: l.custom ? 0 : (l.dpct || 0), tax_rate: 0 }], { ...s, tax_enabled: false, round_off: false }).sub; };

  function persistPending() { try { pending ? localStorage.setItem(PENDING_KEY(), JSON.stringify(pending)) : localStorage.removeItem(PENDING_KEY()); } catch { /* ignore */ } }
  const locked = () => saving || !!pending;

  /* ---------- catalog ---------- */
  function matches() {
    const q = query.trim().toLowerCase();
    let list = Store.items.filter(i => i.active);
    if (category !== 'All') list = list.filter(i => i.category === category);
    if (q) {
      const scored = [];
      for (const i of list) {
        const name = i.name.toLowerCase(), code = (i.code || '').toLowerCase(), alias = (i.alias || '').toLowerCase();
        let score = -1;
        if (code && code === q) score = 0; else if (name.startsWith(q) || alias.startsWith(q)) score = 1; else if (code.startsWith(q)) score = 2;
        else if (name.split(/\s+/).some(w => w.startsWith(q))) score = 3; else if (name.includes(q) || alias.includes(q)) score = 4;
        if (score >= 0) scored.push([score, i]);
      }
      list = scored.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).map(x => x[1]);
    }
    return list;
  }
  const noStock = i => i.track_stock && Number(i.stock) <= 0;
  const blocked = i => noStock(i) && !warnMode();
  function stockBadge(i) {
    if (!i.track_stock || !Store.feature('stock_badges') || !Store.stockShown()) return '';
    const n = Number(i.stock);
    if (n <= 0) return '<span class="badge badge-red">Out of stock</span>';
    if (n <= Number(i.low_stock_at)) return `<span class="badge badge-amber">${Fmt.qty(n)} left</span>`;
    return `<span class="stock-note">${Fmt.qty(n)} ${esc(i.unit)}</span>`;
  }
  function inCart(id) { return cart.filter(l => l.id === id && !l.custom).reduce((a, l) => a + Number(l.qty), 0); }

  /* Rebuilds the grid only when what is shown actually changes (search, category, stock, items). */
  function renderCatalog(force) {
    if (!root?.isConnected) return;
    const list = matches(), shown = list.slice(0, 120), codes = Store.feature('item_codes_on_tiles');
    if (highlight >= shown.length) highlight = Math.max(0, shown.length - 1);
    const cats = ['All', ...Store.categories.filter(c => Store.items.some(i => i.active && i.category === c))];
    const sig = JSON.stringify([category, query, highlight, cats, shown.map(i => [i.id, i.name, i.price, i.stock, i.track_stock, i.code]), warnMode(), Store.stockShown(), codes, list.length]);
    if (!force && sig === catalogSig) return paintBadges();
    catalogSig = sig;
    $('#bCats', root).innerHTML = cats.map(c => `<button type="button" class="chip ${c === category ? 'on' : ''}" data-cat="${esc(c)}">${esc(c === 'All' ? 'All items' : c)}</button>`).join('');
    const grid = $('#bGrid', root);
    if (!Store.items.length) {
      grid.innerHTML = `<div class="empty"><h3>No items yet</h3><p>${Store.can('items') ? 'Add the things you sell in <a href="#/items">Items</a>.' : 'Ask the owner to add items.'}</p></div>`;
    } else if (!list.length) {
      grid.innerHTML = `<div class="empty"><h3>No match for “${esc(query)}”</h3><p>Check the spelling or code${Store.feature('extra_items') ? ', or add it as an extra item' : ''}.</p></div>`;
    } else {
      grid.innerHTML = shown.map((i, n) => `<button type="button" class="tile ${n === highlight && query ? 'hl' : ''} ${blocked(i) ? 'off' : ''}" data-add="${esc(i.id)}" ${blocked(i) ? 'aria-disabled="true"' : ''}>
        <span class="tile-name">${esc(i.name)}</span>
        ${codes && i.code ? `<span class="tile-code">${esc(i.code)}</span>` : ''}
        <span class="tile-foot"><b>${Fmt.money(i.price)}</b><small>/${esc(i.unit)}</small>${stockBadge(i)}</span></button>`).join('') +
        (list.length > shown.length ? `<p class="grid-more">Showing 120 of ${list.length}. Type more of the name to narrow down.</p>` : '');
    }
    paintBadges();
  }
  /* Updates only the “×N” badges. Only the item that just changed animates. */
  function paintBadges(changedId) {
    if (!root?.isConnected || !Store.feature('qty_badges')) return;
    for (const tile of $$('#bGrid .tile', root)) {
      const id = tile.dataset.add, q = inCart(id);
      let b = tile.querySelector('.tile-qty');
      tile.classList.toggle('in-bill', q > 0);
      if (!q) { b?.remove(); continue; }
      if (!b) { b = document.createElement('span'); b.className = 'tile-qty'; b.setAttribute('aria-hidden', 'true'); tile.prepend(b); }
      const txt = '×' + Fmt.qty(q);
      if (b.textContent !== txt) b.textContent = txt;
      if (id === changedId) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
    }
  }

  function stockNote(item, wanted) {
    if (!item.track_stock || wanted <= Number(item.stock)) return wanted;
    if (warnMode()) { toast(`${item.name}: only ${Fmt.qty(Math.max(0, item.stock))} ${item.unit} in stock. Billing more than stock.`, 'warn'); return wanted; }
    toast(`Only ${Fmt.qty(Math.max(0, item.stock))} ${item.unit} of ${item.name} in stock.`, 'warn');
    return Math.max(0, Number(item.stock));
  }

  function add(item, qty = 1) {
    if (locked()) return toast('Finish saving the current bill first.', 'warn');
    if (blocked(item)) return toast(`${item.name} is out of stock.`, 'warn');
    lastBill = null;
    let l = cart.find(x => x.id === item.id && !x.custom);
    const want = +((l ? Number(l.qty) : 0) + qty).toFixed(3), q = stockNote(item, want);
    if (l) { if (q === Number(l.qty)) return paintBadges(item.id); l.qty = q; }
    else {
      if (q <= 0) return;
      l = { key: crypto.randomUUID(), id: item.id, name: item.name, unit: item.unit, price: Number(item.price), qty: q, code: item.code || '',
            dpct: Number(item.default_discount) || 0, rate: item.tax_rate == null ? null : Number(item.tax_rate), incl: !!item.price_includes_tax };
      cart.unshift(l);
    }
    renderTicket(l.key, item.id);
  }

  async function addExtra() {
    if (locked() || !Store.feature('extra_items')) return;
    const d = modal('Add extra item', `<form id="xForm" class="form-grid">
      <label class="field span-2"><span>Item name</span><input name="name" required maxlength="120" placeholder="e.g. Carry bag" autocomplete="off"></label>
      <label class="field"><span>Price (${esc(Fmt.cur())})</span><input name="price" required type="number" min="0.01" max="9999999" step="0.01" inputmode="decimal"></label>
      <label class="field"><span>Quantity</span><input name="qty" required type="number" min="0.001" max="999999" step="any" value="1" inputmode="decimal"></label>
      <p class="hint span-2">Only added to this bill. It is not saved in Items and does not change stock.</p>
      <div class="modal-actions span-2"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary">Add to bill</button></div></form>`, { size: 'modal-sm' });
    $('[name=name]', d).focus();
    $('#xForm', d).onsubmit = e => {
      e.preventDefault(); const f = new FormData(e.target);
      lastBill = null;
      cart.unshift({ key: crypto.randomUUID(), id: null, custom: true, name: String(f.get('name')).trim(), unit: 'pcs', price: Math.round(Number(f.get('price')) * 100) / 100, qty: Number(f.get('qty')) });
      d.close(); renderTicket(cart[0].key); focusSearch();
    };
  }

  /* ---------- ticket (the bill) ---------- */
  function taxRows(t) {
    const s = Store.settings; if (!s.tax_enabled) return '';
    const label = esc(s.tax_label || 'Tax'), rows = [];
    const push = (name, rate, amt, incl) => {
      if (s.tax_split) { const [c, g] = Calc.split(amt), h = Number(rate) / 2; rows.push([`CGST${rate !== '' ? ' ' + Fmt.qty(h) + '%' : ''}${incl ? ' (incl.)' : ''}`, c], [`SGST${rate !== '' ? ' ' + Fmt.qty(h) + '%' : ''}${incl ? ' (incl.)' : ''}`, g]); }
      else rows.push([`${name}${rate !== '' ? ' ' + Fmt.qty(rate) + '%' : ''}${incl ? ' (incl.)' : ''}`, amt]);
    };
    if (s.tax_scope === 'item') { for (const g of t.breakdown) push(label, g.rate, g.tax, g.incl); }
    else push(label, s.tax_mode === 'percent' ? Number(s.tax_value) : '', t.tax, false);
    return rows.map(([n, v]) => `<div class="ts"><span>${n}</span><span>${Fmt.nf2.format(v)}</span></div>`).join('');
  }

  function renderTicket(flashKey, changedId) {
    if (!root?.isConnected) return;
    const t = totals(), lock = locked(), L = Receipt.labels();
    const lines = $('#tLines', root);
    lines.innerHTML = cart.length ? cart.map(l => `<li class="tl ${l.key === flashKey ? 'flash' : ''}" data-key="${esc(l.key)}">
        <div class="tl-name">${esc(l.name)}${l.custom ? '<em>extra</em>' : ''}<small>${Fmt.money(l.price)} / ${esc(l.unit)}${!l.custom && l.dpct ? ` · <span class="tl-off">−${Fmt.qty(l.dpct)}%</span>` : ''}</small></div>
        <div class="tl-qty"><button type="button" class="qbtn" data-dec aria-label="Less" ${lock ? 'disabled' : ''}>${Icon('minus')}</button><input type="number" inputmode="decimal" step="any" min="0" value="${Number(l.qty)}" aria-label="Quantity of ${esc(l.name)}" data-qty ${lock ? 'disabled' : ''}><button type="button" class="qbtn" data-inc aria-label="More" ${lock ? 'disabled' : ''}>${Icon('plus')}</button></div>
        <div class="tl-amt">${Fmt.nf2.format(lineTotal(l))}</div>
        <button type="button" class="tl-del" data-del aria-label="Remove ${esc(l.name)}" ${lock ? 'disabled' : ''}>${Icon('x')}</button></li>`).join('')
      : `<li class="t-empty">${lastBill ? `<b>Ready for the next customer.</b>` : '<b>Bill is empty.</b>'}<span>${isTouch() ? 'Tap an item to add it.' : 'Scan a barcode, type a name and press Enter, or tap an item.'}</span></li>`;
    if (flashKey) lines.querySelector('.flash')?.scrollIntoView({ block: 'nearest' });

    $('#tCount', root).textContent = cart.length ? `${cart.length} line${cart.length === 1 ? '' : 's'} · Qty ${Fmt.qty(t.qty)}` : '';
    $('#tSums', root).innerHTML = `
      <div class="ts"><span>${esc(L.subtotal)}</span><span>${Fmt.nf2.format(t.sub)}</span></div>
      ${t.disc ? `<div class="ts"><span>${esc(L.discount)}</span><span>−${Fmt.nf2.format(t.disc)}</span></div>` : ''}
      ${taxRows(t)}
      ${t.round ? `<div class="ts"><span>${esc(L.round_off)}</span><span>${t.round > 0 ? '+' : ''}${Fmt.nf2.format(t.round)}</span></div>` : ''}
      ${t.less ? `<div class="ts ts-less"><span>${esc(L.less)}</span><span>−${Fmt.nf2.format(t.less)}</span></div>` : ''}
      <div class="ts ts-grand"><span>${esc(L.total_screen)}</span><span>${Fmt.money(t.final)}</span></div>`;

    const methods = Store.payments();
    if (!methods.includes(payment)) payment = methods[0] || 'Cash';
    for (const b of $$('[data-pay]', root)) { b.classList.toggle('on', b.dataset.pay === payment); b.setAttribute('aria-pressed', b.dataset.pay === payment); b.disabled = lock; }
    $('#tCash', root).hidden = !cashOn() || !cart.length;
    $('#tChange', root).innerHTML = !t.rec ? '' : t.short
      ? (t.shortBlocked ? `<span class="neg">Short by ${Fmt.money(t.short)}. ${t.shortBlocked === 'max' ? `You can accept at most ${Fmt.money(Store.sys.limits?.max_short_amount ?? 0)} less.` : esc(t.shortBlocked)}</span>` : `<span class="short-ok">Short by ${Fmt.money(t.short)} — bill will be <b>${Fmt.money(t.final)}</b></span>`)
      : `Return <b>${Fmt.money(t.change)}</b>`;
    $('#tDiscRow', root).hidden = !Store.can('discount');
    for (const el of $$('#tDiscMode, #tDiscVal, #tCust input, #tReceived, #tExtra', root)) el.disabled = lock;
    const custOn = Store.feature('customer_details'), addrOn = Store.feature('customer_address'), notesOn = Store.feature('notes'), cf = customFields();
    $('#tCustName', root).hidden = $('#tCustPhone', root).hidden = !custOn;
    $('#tCustAddr', root).hidden = !addrOn;
    $('#tNotes', root).hidden = !notesOn;
    $('#tFields', root).hidden = !cf.length;
    const tog = $('#tCustToggle', root), any = custOn || addrOn || notesOn || cf.length;
    tog.hidden = !any; $('#tCust', root).hidden = !showExtras || !any;
    const parts = [custOn || addrOn ? 'customer' : '', notesOn ? 'note' : '', cf.length ? 'details' : ''].filter(Boolean);
    const word = parts.length > 1 ? parts.slice(0, -1).join(', ') + ' & ' + parts.at(-1) : parts[0] || '';
    const filled = customer.name || customer.phone || customer.address || notes || Object.values(fields).some(Boolean);
    tog.textContent = showExtras ? `Hide ${word}` : `${filled ? 'Edit' : '+ Add'} ${word}`;
    $('#tExtra', root).hidden = !Store.feature('extra_items');

    const canSave = !saving && (pending || cart.length > 0), k = isTouch() ? '' : ' <kbd>F8</kbd>', k9 = isTouch() ? '' : ' <kbd>F9</kbd>';
    $('#tSave', root).disabled = !canSave; $('#tPrint', root).disabled = !canSave;
    $('#tSave', root).innerHTML = saving ? 'Saving…' : pending ? 'Retry save' : 'Save' + k;
    $('#tPrint', root).innerHTML = saving ? 'Saving…' : pending ? `${Icon('printer')} Retry & print` : `${Icon('printer')} Save & print${k9}`;
    $('#tClear', root).disabled = lock || !cart.length;
    $('#tPending', root).hidden = !pending;

    const done = $('#tDone', root);
    done.hidden = !lastBill;
    if (lastBill) done.innerHTML = `<div class="done-text">${Icon('check')}<span><b>${esc(lastBill.bill_no)}</b> saved · ${Fmt.money(lastBill.total)} · ${esc(lastBill.payment_method)}${Number(lastBill.change_amount) > 0 ? ` · return ${Fmt.money(lastBill.change_amount)}` : ''}</span></div>
      <div class="done-actions"><button type="button" class="btn btn-sm" data-reprint>${Icon('printer')} Print</button>${Store.feature('whatsapp') ? `<button type="button" class="btn btn-sm" data-wa>${Icon('whatsapp')} WhatsApp</button>` : ''}<button type="button" class="btn btn-sm btn-ghost" data-view>View</button></div>`;

    $('#mTotal', root).textContent = Fmt.money(t.final);
    $('#mCount', root).textContent = cart.length ? `${cart.length} line${cart.length === 1 ? '' : 's'} · Qty ${Fmt.qty(t.qty)}` : 'Empty bill';
    paintBadges(changedId);
  }

  function setQty(key, value) {
    const l = cart.find(x => x.key === key); if (!l || locked()) return;
    let q = Math.round(Number(value) * 1000) / 1000;
    if (!Number.isFinite(q) || q < 0) q = 1;
    if (q === 0) { cart = cart.filter(x => x !== l); renderTicket(null, l.id); return; }
    const item = l.id && Store.items.find(i => i.id === l.id);
    if (item) q = stockNote(item, q);
    if (q <= 0) { cart = cart.filter(x => x !== l); renderTicket(null, l.id); return; }
    l.qty = q; renderTicket(l.key, l.id);
  }

  function resetBill() { cart = []; discount = { mode: discount.mode, value: '' }; customer = { name: '', phone: '', address: '' }; notes = ''; received = ''; fields = {}; showExtras = false; }
  async function clearBill() {
    if (locked() || !cart.length) return;
    if (cart.length > 1 && !(await ask({ title: 'Clear this bill?', body: 'All lines on the current bill will be removed.', confirm: 'Clear bill', danger: true }))) return;
    resetBill(); syncInputs(); renderTicket(); focusSearch();
  }

  function paintFields() {
    const box = $('#tFields', root); if (!box) return;
    box.innerHTML = customFields().map((lab, i) => `<input data-cf="${esc(lab)}" maxlength="120" placeholder="${esc(lab)}" aria-label="${esc(lab)}" value="${esc(fields[lab] || '')}">`).join('');
  }
  function syncInputs() {
    $('#tDiscMode', root).value = discount.mode; $('#tDiscVal', root).value = discount.value;
    $('#tCustName', root).value = customer.name; $('#tCustPhone', root).value = customer.phone; $('#tCustAddr', root).value = customer.address || ''; $('#tNotes', root).value = notes;
    $('#tReceived', root).value = received; paintFields();
  }

  /* ---------- save ---------- */
  async function save(andPrint) {
    if (saving) return;
    if (!pending) {
      if (!cart.length) return;
      const t = totals();
      if (t.shortBlocked) { $('#tReceived', root)?.focus(); return toast(`Cash is short by ${Fmt.money(t.short)}. ${t.shortBlocked === 'max' ? `You can accept at most ${Fmt.money(Store.sys.limits?.max_short_amount ?? 0)} less.` : t.shortBlocked}`, 'warn', 5000); }
      const items = [...cart].reverse().map(l => l.custom ? { custom: true, name: l.name, price: l.price.toFixed(2), qty: String(l.qty), unit: l.unit } : { id: l.id, name: l.name, qty: String(l.qty) });
      const dv = Store.can('discount') ? Number(discount.value) || 0 : 0, custOn = Store.feature('customer_details');
      const extra = {};
      if (Store.feature('customer_address') && customer.address?.trim()) extra.customer_address = customer.address.trim();
      const cf = customFields().map(label => ({ label, value: (fields[label] || '').trim() })).filter(x => x.value);
      if (cf.length) extra.custom_fields = cf;
      pending = {
        args: { p_request_id: crypto.randomUUID(), p_items: items, p_payment_method: payment, p_discount_mode: dv > 0 ? discount.mode : null, p_discount_value: dv > 0 ? dv : 0,
          p_customer_name: custOn ? customer.name.trim() : '', p_customer_phone: custOn ? customer.phone.trim() : '', p_notes: Store.feature('notes') ? notes.trim() : '',
          p_expected_total: t.final, p_cash_received: t.rec > 0 ? t.rec : null, p_extra: Object.keys(extra).length ? extra : null },
        state: { cart, payment, discount, customer, notes, received, fields }
      };
      persistPending();
    }
    saving = true; renderTicket();
    try {
      const bill = await Cloud.rpc('shop_create_bill', pending.args);
      pending = null; persistPending();
      lastBill = bill; resetBill(); payment = Store.payments()[0] || 'Cash';
      syncInputs(); toast(`${bill.bill_no} saved · ${Fmt.money(bill.total)}${Number(bill.change_amount) > 0 ? ' · return ' + Fmt.money(bill.change_amount) : ''}`, 'ok');
      document.body.classList.remove('sheet-open');
      if (andPrint) Receipt.print(bill);
      Store.applyStockUpdates(bill.stock_updates);
    } catch (e) {
      if (e.code === 'LOCKED') return;
      if (e.code === 'NETWORK' || !e.status || e.status >= 500) {
        toast('Not saved yet: ' + e.message + ' Press Retry save — it will not create a double bill.', 'error', 7000);
      } else {
        pending = null; persistPending();
        toast(e.message, 'error', 7000);
        if (/stock|no longer for sale|Prices/i.test(e.message)) Store.loadItems(true).catch(() => {});
        if (/payment method|permission|allowed|turned off/i.test(e.message)) App.refreshMe().then(() => renderTicket()).catch(() => {});
      }
    } finally { saving = false; renderTicket(); }
  }

  /* ---------- keyboard ---------- */
  function focusSearch() { const s = $('#bSearch', root); if (s && !isTouch()) { s.focus(); s.select(); } }
  function onKey(e) {
    if (!root?.isConnected || $('dialog[open]')) return;
    if (e.key === 'F2') { e.preventDefault(); focusSearch(); }
    else if (e.key === 'F8') { e.preventDefault(); save(false); }
    else if (e.key === 'F9') { e.preventDefault(); save(true); }
    else if (e.key === 'F4') { e.preventDefault(); if (!locked()) { const m = Store.payments(); payment = m[(m.indexOf(payment) + 1) % m.length]; renderTicket(); } }
    else if (e.altKey && e.key.toLowerCase() === 'x') { e.preventDefault(); addExtra(); }
    else if (e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); clearBill(); }
  }

  /* ---------- mount ---------- */
  function mount(view) {
    root = view; catalogSig = '';
    const methods = Store.payments();
    if (!methods.includes(payment)) payment = methods[0] || 'Cash';
    view.innerHTML = `<div class="billing">
      <section class="catalog" aria-label="Items">
        <div class="catalog-bar">
          <label class="search">${Icon('search')}<input id="bSearch" type="search" placeholder="${isTouch() ? 'Search items' : 'Scan barcode or type item name or code'}" autocomplete="off" aria-label="Search items">${isTouch() ? '' : '<kbd>F2</kbd>'}</label>
          <button type="button" class="btn" id="tExtra" title="Add extra item">${Icon('plus')} <span>Extra item</span></button>
        </div>
        <div class="chips" id="bCats" role="toolbar" aria-label="Categories"></div>
        <div class="grid" id="bGrid"></div>
      </section>
      <aside class="ticket" id="ticket" aria-label="Current bill">
        <button type="button" class="sheet-close" id="sheetClose">${Icon('x')} Back to items</button>
        <div class="t-done" id="tDone" hidden></div>
        <div class="paper">
          <div class="paper-head"><span>Current bill</span><span id="tCount"></span></div>
          <ul class="t-lines" id="tLines"></ul>
          <div class="t-sums" id="tSums"></div>
        </div>
        <div class="t-controls">
          <div class="t-row" id="tDiscRow"><label for="tDiscVal">Discount</label><div class="joined"><input id="tDiscVal" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"><select id="tDiscMode" aria-label="Discount type"><option value="percent">%</option><option value="amount">${esc(Fmt.cur())}</option></select></div></div>
          <button type="button" class="linkish" id="tCustToggle"></button>
          <div class="t-cust" id="tCust" hidden>

  <script>/* Owner dashboard: sales, trend, payments, best sellers, low stock. */
'use strict';
const Dashboard = (() => {
  let period = 'today', from = '', to = '', root = null, req = 0;

  function trendLabel(key, unit, short) {
    if (unit === 'hour') { const h = Number(key); return (h % 12 || 12) + (h < 12 ? 'am' : 'pm'); }
    if (unit === 'day') { const d = new Date(key + 'T12:00:00Z'); return short ? String(d.getUTCDate()) : d.toLocaleDateString('en-IN', { timeZone: 'UTC', day: 'numeric', month: 'short', weekday: 'short' }); }
    const d = new Date(key + '-15T12:00:00Z'); return d.toLocaleDateString('en-IN', { timeZone: 'UTC', month: 'short', ...(short ? {} : { year: 'numeric' }) });
  }

  function barChart(trend, unit) {
    const W = 760, H = 220, P = { l: 52, r: 8, t: 12, b: 26 };
    const max = Math.max(...trend.map(t => Number(t.sales)), 0);
    if (!max) return `<div class="empty slim"><p>No sales in this period yet.</p></div>`;
    const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= max) return m * p; return 10 * p; })();
    const iw = W - P.l - P.r, ih = H - P.t - P.b, n = trend.length, slot = iw / n, bw = Math.max(2, Math.min(28, slot * 0.62));
    const y = v => P.t + ih - (v / nice) * ih;
    const step = Math.ceil(n / 12);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = nice * i / 4, yy = y(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" class="grid-l"/><text x="${P.l - 8}" y="${yy + 4}" class="ax" text-anchor="end">${esc(Fmt.compact(v))}</text>`; }
    const bars = trend.map((t, i) => {
      const v = Number(t.sales), x = P.l + slot * i + (slot - bw) / 2, h = Math.max(v ? 2 : 0, ih - (y(v) - P.t)), yy = P.t + ih - h, r = Math.min(4, bw / 2, h);
      const path = h ? `M${x},${P.t + ih} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${P.t + ih} Z` : '';
      return `<g class="bar" data-i="${i}"><rect x="${P.l + slot * i}" y="${P.t}" width="${slot}" height="${ih}" class="hit"/>${path ? `<path d="${path}"/>` : ''}${i % step === 0 ? `<text x="${x + bw / 2}" y="${H - 8}" class="ax" text-anchor="middle">${esc(trendLabel(t.key, unit, true))}</text>` : ''}</g>`;
    }).join('');
    return `<div class="chart" data-unit="${unit}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales by ${unit}">${g}<line x1="${P.l}" x2="${W - P.r}" y1="${P.t + ih}" y2="${P.t + ih}" class="base-l"/>${bars}</svg><div class="tip" hidden></div></div>`;
  }

  function hbars(rows, label, value, fmt, sub) {
    const max = Math.max(...rows.map(r => Number(r[value])), 0) || 1;
    return `<ul class="hbars">${rows.map(r => `<li><div class="hb-top"><span>${esc(r[label])}</span><b>${fmt(r[value])}</b></div><div class="hb-track"><i style="width:${(Number(r[value]) / max * 100).toFixed(1)}%"></i></div>${sub ? `<small>${sub(r)}</small>` : ''}</li>`).join('')}</ul>`;

  function delta(now, prev) {

  async function load() {

      const d = await Cloud.rpc('shop_dashboard', { p_from: f, p_to: t });

  const monthName = m => new Date(m + 'T12:00:00Z').toLocaleDateString('en-IN', { timeZone: 'UTC', month: 'long', year: 'numeric' });
