<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Waiter Orders & Calls</title><link rel="stylesheet" href="waiter.css"><link rel="stylesheet" href="call-requests.css"><style>.compact-alerts{margin:24px 0;}.compact-alerts p{color:#b91c1c;font-size:14px;line-height:1.5;margin-top:10px;}[hidden]{display:none!important;}</style></head>
<body>
<header><div><p class="eyebrow" id="waiterRestaurant"></p><h1>Waiter orders & calls</h1></div><span class="connection" id="waiterConnection">Connecting</span></header>
<main><p id="waiterError" role="status"></p>
<section id="backgroundAlertPanel" class="compact-alerts" hidden aria-label="Call alerts"><button id="backgroundAlertButton" type="button" aria-pressed="false" class="waiter-button">Call alerts</button><p id="backgroundAlertStatus" role="status" hidden></p></section>
<section id="waiterCallPanel" aria-labelledby="waiterCallHeading" hidden>
<div class="page-heading"><div><h2 id="waiterCallHeading">Requests <span id="waiterCallCount" class="call-count">0</span></h2></div><button id="waiterSoundButton" class="waiter-button" type="button" aria-pressed="false">Enable sound</button></div>
<p id="waiterCallNotice" role="status" hidden></p><div id="waiterCalls"></div>
</section>
<section class="waiter-orders-section" aria-labelledby="waiterOrderHeading"><div class="page-heading"><h2 id="waiterOrderHeading">All active orders</h2><p id="waiterCount" class="muted"></p></div><div class="orders-grid" id="waiterOrders"></div></section>
</main>
<script src="config.js"></script><script src="cloud.js"></script><script src="push-config.js"></script><script src="background-alerts.js"></script><script src="call-requests.js"></script><script src="waiter.js"></script>
</body></html>
